name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      # PySide6'nin offscreen eklentisi Ubuntu/Python 3.13 birleşiminde aralıklı
      # yerel hata verebiliyor. Uzak ekran sunucusu, masaüstü testlerini gerçek
      # Qt pencere katmanında ancak görünür ekran olmadan çalıştırır.
      QT_QPA_PLATFORM: xcb
      MUHASEBE_ASISTANI_DISABLE_LOCAL_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -r requirements.txt -r platform_api/requirements.txt
      - run: python scripts/check_public_data.py
      - run: xvfb-run -a python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          # Disposable CI service only; this is not a deployment credential.
          POSTGRES_PASSWORD: synthetic-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARPAN_TEST_PG_ADMIN_DSN: postgresql://postgres:synthetic-ci-postgres@127.0.0.1:5432/postgres
      CARPAN_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform_api/requirements.txt
      - run: python -m pip install -r platform_api/requirements.txt
      - run: python -m pytest -q platform_api/tests/postgres
